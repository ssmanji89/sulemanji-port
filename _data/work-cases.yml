- slug: ff-cli
  category: Personal decision tools
  title: Learning fantasy football by building a tool
  dek: League-specific valuation, draft preparation, and decisions that change with
    the time horizon.
  status: Public case and demo; private source
  intro:
  - I joined a coworker fantasy football league in 2026 with no previous playing experience.
    I responded by building a tool to make the scoring rules and tradeoffs easier
    to understand.
  - ff-cli combines projections, league settings, market information, and roster constraints.
    The public demonstration shows an offline auction interface. The actual league
    uses a snake draft, so auction support is one mode within the broader project.
  sections:
  - title: Make value depend on the league
    paragraphs:
    - A player ranking means more when it reflects the league’s scoring and roster
      rules. The valuation code compares projected points with a replacement baseline
      for the relevant position.
    - That gives me a way to examine the surplus a player may contribute. The tool
      can then relate that estimate to market information and the choices available
      to a particular roster.
    - I want to understand why two players rank differently, including which assumptions
      drive the difference.
    bullets: []
  - title: Build an interface for a moving draft
    paragraphs:
    - The auction mode runs as a local web application. It shows a proposed bid ceiling,
      remaining budgets, roster needs, and the available-player board.
    - Recording a sale changes the next decision. An event log preserves the session,
      and an undo action handles entry mistakes.
    - The public demo uses synthetic owner names. It lets someone inspect the interaction
      without publishing another league member’s information.
    bullets: []
  - title: Look beyond the next move
    paragraphs:
    - The project also compares feasible actions across the current week, the remaining
      season, and the playoffs. Those horizons can favor different choices.
    - Market analysis uses a fixed data snapshot so the comparisons share the same
      inputs. That helps me understand whether a changed result comes from new information
      or different reasoning.
    - The case demonstrates the tool and the decisions it helps explain. It does not
      claim a competitive result. The source repository and package downloads remain
      private.
    bullets: []
