name: Deploy service

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/editorial.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/editorial.yml'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Validate only, or deploy an isolated service environment
        required: true
        type: choice
        options: [validate, staging, production]
        default: validate

permissions:
  contents: read

concurrency:
  group: editorial-${{ inputs.deploy_environment || (github.event_name == 'push' && 'production') || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test editorial Worker
        run: npm test && npx tsc --noEmit
      - name: Validate production Worker package
        run: npx wrangler deploy --dry-run --config wrangler.editorial.jsonc
      - name: Validate staging Worker package
        run: npx wrangler deploy --dry-run --config wrangler.editorial-staging.jsonc

  deploy-staging:
    needs: validate
    if: github.repository == 'ssmanji89/sulemanji-port' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-staging
    concurrency:
      group: editorial-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[vars.EDITORIAL_TOKEN_SECRET_NAME] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EDITORIAL_DATABASE_ID: ${{ vars.EDITORIAL_DATABASE_ID }}
      EDITORIAL_DATABASE_NAME: ${{ vars.EDITORIAL_DATABASE_NAME }}
      EDITORIAL_WORKER_NAME: ${{ vars.EDITORIAL_WORKER_NAME }}
      EDITORIAL_WORKFLOW_NAME: ${{ vars.EDITORIAL_WORKFLOW_NAME }}
      EDITORIAL_CUSTOM_DOMAIN: ${{ vars.EDITORIAL_CUSTOM_DOMAIN }}
      EDITORIAL_WORKERS_DEV: ${{ vars.EDITORIAL_WORKERS_DEV }}
      EDITORIAL_CRON_SCHEDULE: ${{ vars.EDITORIAL_CRON_SCHEDULE }}
      EDITORIAL_POLICY_REVISION: ${{ vars.EDITORIAL_POLICY_REVISION }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Require staging deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$EDITORIAL_DATABASE_ID"
      - name: Refuse a stale staging revision
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Render staging config with private D1 binding
        run: node scripts/render-editorial-config.mjs staging
      - name: Apply pending staging D1 migrations with freshness fence
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if ! npx wrangler d1 migrations apply DB --remote --config wrangler.editorial-staging.runtime.jsonc > "$RUNNER_TEMP/migrations.log" 2>&1; then
            echo "::error::Migration failed; private resource diagnostics were suppressed."
            exit 1
          fi
      - name: Read back staging migrations before deployment
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.editorial-staging.runtime.jsonc > "$RUNNER_TEMP/migrations-state.txt" 2>&1
          node scripts/verify-editorial-migrations.mjs "$RUNNER_TEMP/migrations-state.txt"
      - name: Refuse a stale staging revision before deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy staging Worker and Workflow
        run: |
          if ! npx wrangler deploy --config wrangler.editorial-staging.runtime.jsonc --message "service staging $GITHUB_SHA" > "$RUNNER_TEMP/deploy.log" 2>&1; then
            echo "::error::Deployment failed; private resource diagnostics were suppressed."
            exit 1
          fi
      - name: Read back and verify exact staging deployment
        run: |
          npx wrangler deployments list --json --config wrangler.editorial-staging.runtime.jsonc > "$RUNNER_TEMP/deployments.json" 2>/dev/null
          node scripts/verify-editorial-deployment.mjs "$RUNNER_TEMP/deployments.json" staging "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

  deploy-production:
    needs: validate
    if: github.repository == 'ssmanji89/sulemanji-port' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production'))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
    concurrency:
      group: editorial-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[vars.EDITORIAL_TOKEN_SECRET_NAME] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EDITORIAL_DATABASE_ID: ${{ vars.EDITORIAL_DATABASE_ID }}
      EDITORIAL_DATABASE_NAME: ${{ vars.EDITORIAL_DATABASE_NAME }}
      EDITORIAL_WORKER_NAME: ${{ vars.EDITORIAL_WORKER_NAME }}
      EDITORIAL_WORKFLOW_NAME: ${{ vars.EDITORIAL_WORKFLOW_NAME }}
      EDITORIAL_CUSTOM_DOMAIN: ${{ vars.EDITORIAL_CUSTOM_DOMAIN }}
      EDITORIAL_WORKERS_DEV: ${{ vars.EDITORIAL_WORKERS_DEV }}
      EDITORIAL_CRON_SCHEDULE: ${{ vars.EDITORIAL_CRON_SCHEDULE }}
      EDITORIAL_POLICY_REVISION: ${{ vars.EDITORIAL_POLICY_REVISION }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Require production deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$EDITORIAL_DATABASE_ID"
      - name: Refuse a stale production revision
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Render production config with private D1 binding
        run: node scripts/render-editorial-config.mjs production
      - name: Apply pending production D1 migrations with freshness fence
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if ! npx wrangler d1 migrations apply DB --remote --config wrangler.editorial.runtime.jsonc > "$RUNNER_TEMP/migrations.log" 2>&1; then
            echo "::error::Migration failed; private resource diagnostics were suppressed."
            exit 1
          fi
      - name: Read back production migrations before deployment
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.editorial.runtime.jsonc > "$RUNNER_TEMP/migrations-state.txt" 2>&1
          node scripts/verify-editorial-migrations.mjs "$RUNNER_TEMP/migrations-state.txt"
      - name: Refuse a stale production revision before deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy production Worker and Workflow
        run: |
          if ! npx wrangler deploy --config wrangler.editorial.runtime.jsonc --message "service production $GITHUB_SHA" > "$RUNNER_TEMP/deploy.log" 2>&1; then
            echo "::error::Deployment failed; private resource diagnostics were suppressed."
            exit 1
          fi
      - name: Read back and verify exact production deployment
        run: |
          npx wrangler deployments list --json --config wrangler.editorial.runtime.jsonc > "$RUNNER_TEMP/deployments.json" 2>/dev/null
          node scripts/verify-editorial-deployment.mjs "$RUNNER_TEMP/deployments.json" production "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
