  diagram: knowledge-cycle
  diagram_caption: Each pass updates the record. Reuse includes a fresh check.
  diagram_alt: Knowledge that survives the next session
  diagram_text_equivalent: Capture observations with where and when they came from. Check the current state before reuse, apply knowledge in context, then revise, fix, or expire it. The cycle updates working knowledge.
- slug: service-operations
  category: My work at Viyu
  title: Keep the business task in view
  dek: Service investigations, Microsoft 365, identity, infrastructure, and planned
    changes that need clear ownership.
  status: Professional practice at Viyu Network Solutions
  intro:
  - I work as a services engineer at Viyu Network Solutions. My work spans investigations,
    Microsoft 365, identity, infrastructure, migration planning, and technical scoping.
  - 'I care about the task people need to complete: opening the application, reaching
    shared files, signing in after a change, or finishing a normal workday. The engineering
    needs to connect back to that task.'
  sections:
  - title: Establish what is actually happening
    paragraphs:
    - A ticket usually starts with a symptom. Documentation may describe an earlier
      configuration. A monitoring alert shows one part of the environment.
    - I bring those records together around a specific question. Which system is affected?
      What changed? What observation would help distinguish one explanation from another?
    - Agents help collect information, compare records, and prepare investigation
      notes. I remain responsible for choosing the right target, interpreting the
      information, and deciding what action follows.
    - The useful result is a clearer understanding of the service. Closing a ticket
      or receiving a successful API response does not, by itself, show that someone
      can finish their work.
    bullets: []
  - title: Plan a change around its dependencies
    paragraphs:
    - A migration can involve identities, devices, applications, files, network access,
      and several teams. The destination is only one part of the plan.
    - I use discovery to establish what moves, what stays, and what people need after
      the change. Access requirements and unresolved application questions affect
      the scope and timing.
    - The plan also needs a clear definition of completion. Data transfer, successful
      sign-in, correct permissions, and application use can require different checks.
    - That work helps the people carrying out the change know what to do, when to
      stop, and who can resolve a dependency.
    bullets: []
  - title: Use automation where it helps the team
    paragraphs:
    - Repeated checks and movement of information are useful places to apply automation.
      I use agents for research, record comparison, draft preparation, and continuity
      between sessions.
    - The person responsible for the work still needs to understand the proposed change
      and its expected result. An unresolved requirement needs to remain visible in
      the draft.
    - I also use research to track vendor changes and service advisories. A general
      advisory starts an investigation. The actual environment determines whether
      the issue applies.
    - 'This is the kind of automation I want for lean teams: less avoidable administration,
      with clear responsibility for decisions and exceptions.'
    bullets: []
  - title: Verify the result and make the handoff useful
    paragraphs:
    - After a change, I return to the original question. Reading the resulting configuration
      may answer part of it. Application testing or user validation may answer the
      rest.
    - The handoff needs to say what is complete, what has been checked, and what remains
      open. The next engineer needs enough context to continue without repeating the
      investigation.
    - I preserve decisions, corrections, and failed approaches when they will help
      future work. I also treat old records as context that may need to be checked
      again.
    bullets: []
  - title: When to talk with Viyu
    paragraphs:
    - This work fits organizations whose daily operations depend on connected applications,
      Microsoft services, and infrastructure.
    - The need may be ongoing IT support, a planned migration, growth across locations,
      or specialist capacity alongside an internal IT team.
    - A useful first conversation starts with what needs to keep working, what is
      changing, and where responsibility is unclear.
    - Business delivery is through Viyu. You can contact the team directly to discuss
      the environment and the help you need.
    bullets: []
