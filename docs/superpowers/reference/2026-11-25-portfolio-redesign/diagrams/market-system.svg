<svg xmlns="http://www.w3.org/2000/svg" class="portfolio-diagram" viewBox="0 0 792 512" role="img" aria-labelledby="market-system-title market-system-desc" style="max-width:100%;height:auto">
<title id="market-system-title">Separating market analysis from action</title>
<desc id="market-system-desc">A conceptual market workflow separates data, analysis, proposed actions, authority, external actions, and recorded results, with review informing the next analysis.</desc>
