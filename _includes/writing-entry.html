{% assign writing_entry_url = site.baseurl | append: include.article.url %}
<article class="proj" data-writing-url="{{ include.article.url | escape }}">
  <h3><a href="{{ writing_entry_url | escape }}">{{ include.article.title | escape }}</a></h3>
  <p>{{ include.article.description | escape }}</p>
  {% include writing-meta.html article=include.article %}
</article>
