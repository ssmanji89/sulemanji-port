- slug: integrations
  category: Public tools
  title: Useful connections between systems
  dek: Published packages and integration work for service platforms, security workflows,
    databases, and reporting.
  status: Published packages and ongoing builds
  intro:
  - A service team can have plenty of software and still spend too much time moving
    information between it. I build integrations around the specific job someone needs
    to complete.
  - My public work includes HaloPSA workflow tools, a ConnectWise Manage package,
    Cavelo nodes for n8n, and PostgreSQL tools. A newer Toast project explores reporting
    with the same attention to clear inputs and useful results.
  sections:
  - title: Give an API a useful working interface
    paragraphs:
    - An API exposes operations. A useful integration also explains which operation
      to use, what information it needs, and what the result means.
    - In halopsa-workflows-mcp, I expose HaloPSA workflow operations through the Model
      Context Protocol. The package supports authenticated workflow listing, detail,
      creation, and deletion. It also handles token reuse around those requests.
    - The integration lets an agent work with named tools and structured arguments.
      That keeps the task visible to the person directing it. The HaloPSA API remains
      responsible for the underlying platform behavior.
    - The package gives the caller a defined set of workflow operations. The public
      source also shows how I separate the API client, tools, configuration, and server.
    bullets: []
  - title: Choose what an agent can reach
    paragraphs:
    - mcp-connectwise-manage derives tools from OpenAPI operations. Exposing an entire
      service API at once creates a different experience from exposing the operations
      needed for one task.
    - The package includes operation allowlists, profile filters, schema validation,
      and paging defaults. It also contains confirmation and dry-run paths for changes.
    - These choices make the integration easier to reason about. A tool should have
      a defined purpose, predictable arguments, and a result that a caller can understand.
    - The published package makes that implementation available to inspect and use.
      Its scope centers on the operations a person chooses to expose.
    bullets: []
  - title: Connect security information to a workflow
    paragraphs:
    - n8n-nodes-cavelo brings Cavelo resource operations into n8n. The package covers
      vulnerabilities, personal-information findings, access audits, and benchmarks.
    - Pagination and polling matter here. A workflow needs a complete collection when
      it asks for one, and it needs a consistent way to notice new information.
    - The implementation includes request handling, pagination helpers, polling triggers,
      and rule-based enrichment. These are the details that make a connector useful
      beyond a single successful request.
    - The package connects systems. Whether a finding needs action still depends on
      the environment and the people responsible for it.
    bullets: []
  - title: Make reporting calculations explainable
    paragraphs:
    - toast-pos-mcp is a newer public implementation for reporting. It separates Standard
      API reporting tools from the Analytics request lifecycle.
    - The code pays particular attention to decimal arithmetic and shared tool registration.
      Financial totals need consistent calculation. A reporting tool also needs the
      same behavior across its entry points.
    - The project includes tests against an installed package using synthetic fixtures.
      Live compatibility and public package release remain unfinished. I describe
      it as a build in progress, while keeping the implementation available to inspect.
    bullets: []
  - title: What these projects have in common
    paragraphs:
    - I tend to spend time at the connection between a request and its meaning. That
      includes authentication, argument validation, paging, error messages, and the
      difference between reading information and changing it.
    - A package release makes code available. It does not tell me how another team
      uses it or establish a support arrangement.
    - For business work, the useful conversation starts with the workflow, the systems
      involved, and the person who owns the result. I work through those questions
      with Viyu.
    bullets: []
