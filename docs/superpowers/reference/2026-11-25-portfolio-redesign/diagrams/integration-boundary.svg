<svg xmlns="http://www.w3.org/2000/svg" class="portfolio-diagram" viewBox="0 0 792 568" role="img" aria-labelledby="integration-boundary-title integration-boundary-desc" style="max-width:100%;height:auto">
<title id="integration-boundary-title">A request is only one part of an integration</title>
<desc id="integration-boundary-desc">An agent request passes through a scoped adapter to an external service; authority controls the adapter and a returned result supplies status and detail.</desc>
