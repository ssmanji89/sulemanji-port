- slug: market-systems
  category: Independent work
  title: Market automation and decision systems
  dek: Years of experiments with market data, recurring jobs, models, interfaces,
    and the decisions that connect them.
  status: A continuing project family
  intro:
  - 'My botStuff work brings together problems I enjoy: probability, software, incomplete
    information, and decisions with consequences.'
  - The work grows across several projects. botStuff, finBots, robinBots, a market
    dashboard, and newer agent tools explore different parts of the problem. Together,
    they show how my attention moves from getting data to understanding what a system
    can reasonably do with it.
  sections:
  - title: Start with the whole job
    paragraphs:
    - An indicator calculation occupies a small part of an automated workflow. The
      program also needs data, a schedule, error handling, useful records, and a way
      to handle an interrupted run.
    - botStuff brings those concerns together in stock and cryptocurrency scripts.
      The source contains recurring jobs, analysis, order and cancellation functions,
      logging, and historical evaluation routines. Docker and shell launchers support
      the surrounding execution work.
    - I use established libraries for broker access, data analysis, and scheduling.
      My work connects those pieces and develops the application behavior around them.
      The broker library remains someone else’s contribution.
    bullets: []
  - title: Follow an idea through several implementations
    paragraphs:
    - finBots carries that experimentation into indicator services, scheduled work,
      model experiments, and trade records. Different branches preserve different
      approaches, so the project makes more sense as a development history than as
      one finished product.
    - robinBots continues part of that work in a more explicit project structure.
      Its main module shares code with a finBots service. The plans and dependency
      files also show a direct connection between those two repositories.
    - Other projects explore different questions. The market dashboard adds a Flask
      backend and React interface for analysis and a trade ledger. Its trade-entry
      route records an entry in the database. It does not place that order with a
      broker.
    bullets: []
  - title: Make a proposed action inspectable
    paragraphs:
    - More recent work asks how an agent can research a market without making its
      conclusion sufficient authority to act.
    - My TradingAgents-RH work extends the attributed TradingAgents framework with
      broker integration, decision records, replay, and a separate approval interface.
      The application distinguishes a proposed action from the checks needed before
      an external action.
    - A smaller public TradingAgents branch explores auxiliary information. It represents
      an observation, its source quality, timing, and confirmation. A deterministic
      score and explicit checks decide whether the proposed action qualifies.
    - That public branch contains utilities and tests. Connecting those utilities
      to the full agent workflow remains separate work. A useful scoring function
      does not become a complete trading system simply because it has a name.
    bullets: []
  - title: What I keep from the experiments
    paragraphs:
    - The recurring questions become more useful than any one model. Can I reconstruct
      the inputs? Can I explain why a decision changes? Can I distinguish a recorded
      intention from an action that actually happens?
    - Those questions also shape the interface. A person needs to see the important
      conditions, compare alternatives, and understand what remains uncertain. More
      information helps only when the interface makes it usable.
    - I keep the historical implementations because they make those changes in thinking
      visible. Some remain prototypes. Some contain direct broker operations. Each
      project needs its own description and current state.
    - This collection documents engineering work and research. It makes no claim about
      investment returns. I judge the software by what I can inspect and reproduce,
      while treating market performance as a separate question.
    bullets: []
