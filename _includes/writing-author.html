<aside class="writing-author" data-writing-author aria-label="About the author">

    By <a data-writing-author-name href="{{ '/about' | relative_url | escape }}">{{ site.person.name | escape }}</a>,
    <span data-writing-author-role>{{ site.person.job_title | escape }}</span> at
    <a href="{{ site.person.employer_url | escape }}">{{ site.person.employer_name | escape }}</a>.
  </p>
</aside>
