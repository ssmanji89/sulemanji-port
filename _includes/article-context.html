{% if include.context %}

  <h2>Related work</h2>
  <p><a data-article-context-proof href="{{ include.context.proof_url | relative_url | escape }}">{{ include.context.proof_label | escape }}</a> <span class="proj-meta">· {{ include.context.proof_status | escape }}</span></p>
