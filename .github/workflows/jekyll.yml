name: Deploy Jekyll site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Production runs share one lock. Pull requests validate independently.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
          python -m pip install --requirement requirements-seo.txt

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Check Worker
        run: npm run check --prefix worker

      - name: Verify Writing source
        run: bundle exec ruby scripts/verify_writing.rb --source-only

      - name: Verify generated article images
        run: python scripts/generate_article_images.py --check

      - name: Build with Jekyll
        run: |
          bundle exec jekyll clean
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify Writing output
        run: bundle exec ruby scripts/verify_writing.rb

      - name: Verify discovery output
        run: python scripts/verify_discovery.py

      - name: Run Writing tests
        run: bundle exec ruby -I scripts/tests -e 'Dir["scripts/tests/test_*.rb"].sort.each { |path| require_relative path }'

      - name: Run discovery tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Verify Work With Me content
        run: python3 scripts/verify_work_with_me.py

      - name: Verify Viyu positioning
        run: python3 scripts/verify_viyu_positioning.py

      - name: Verify public safety
        run: python3 scripts/verify_public_safety.py

      - name: Verify portfolio review
        run: python3 scripts/verify_portfolio_review.py

      - name: Verify Priority Discovery plan
        run: python3 scripts/verify_priority_discovery_plan.py

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
