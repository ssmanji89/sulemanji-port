- slug: mathematical-verification
  category: Mathematics
  title: Reproduce the calculation
  dek: An exact verification bundle for a Jacobian counterexample, with independent
    rational and symbolic checkers.
  status: Research article and exact checkers
  intro:
  - An unexpected mathematical result makes me want to examine the steps. I built
    an independent verification bundle for the three-variable Jacobian counterexample
    announced by Levent Alpöge and attributed to Fable.
  - My contribution is the reproduction, the compact explanatory calculation, and
    the files needed to repeat the checks. Discovery and the external Lean formalization
    belong to their respective authors.
  sections:
  - title: Reduce the claim to two checks
    paragraphs:
    - The example gives a polynomial map in three variables. The verification needs
      to show a nonzero constant Jacobian determinant and distinct inputs with the
      same output.
    - The bundle checks the determinant identity exactly and evaluates the three collision
      points with rational arithmetic. It also checks a normalized version of the
      map.
    - The construction concerns dimension three and extends by identity coordinates
      to higher dimensions. It does not settle the separate two-variable case.
    bullets: []
  - title: Use two computational routes
    paragraphs:
    - The first checker implements sparse multivariate polynomials over rational numbers.
      It provides arithmetic, derivatives, evaluation, and a three-by-three determinant
      without a computer-algebra dependency.
    - The second checker uses SymPy. It repeats the determinant and collision calculations,
      then checks the compact derivation presented in the article.
    - Both routes use exact arithmetic. The bundle includes the recorded output, a
      runner, a dependency pin, and file hashes.
    bullets: []
  - title: Keep the explanation and attribution together
    paragraphs:
    - The article connects the computational checks to a hand-readable determinant
      argument. It also explains the normalization used in the separate Lean proof.
    - Paul Lezeau’s formalization appears in Google DeepMind’s formal-conjectures
      repository. That pull request merged on 26 July 2026, after the original date
      of my article.
    - The work reflects an interest I carry into software. I turn a surprising claim
      into a few checks and preserve the calculation for inspection.
    bullets: []
  projects:
  - name: Jacobian verification dossier
    description: An explanatory article, exact rational checker, SymPy checker, and
      reproducibility files.
    state: Public research branch
    href: https://github.com/ssmanji89/jekyll-TeXt-theme.sulemanji.com/blob/27afec0866b0a7b7b195c94bd83f9bd43524446a/_posts/2026-07-20-jacobian-conjecture-counterexample-exact-verification.md
  sources:
  - label: My verification article
    href: https://github.com/ssmanji89/jekyll-TeXt-theme.sulemanji.com/blob/27afec0866b0a7b7b195c94bd83f9bd43524446a/_posts/2026-07-20-jacobian-conjecture-counterexample-exact-verification.md
  - label: Exact rational checker
    href: https://github.com/ssmanji89/jekyll-TeXt-theme.sulemanji.com/blob/27afec0866b0a7b7b195c94bd83f9bd43524446a/assets/code/jacobian-counterexample/verify_exact.py
  - label: SymPy checker
