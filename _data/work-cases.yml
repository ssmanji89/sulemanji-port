- slug: knowledge-tools
  category: Independent work
  title: Knowledge that survives the next session
  dek: Memory tools, process experiments, and working methods for continuing a task
    without rebuilding its history.
  status: Published tools, prototypes, and working methods
  intro:
  - I work across several projects and use AI agents heavily. The expensive part is
    often reconstructing what happened before the current conversation.
  - I want a useful record of the decision, its basis, and what remains unfinished.
    That problem connects my PostgreSQL tools, the Crisi prototype, and the coordination
    documents I call Sullydox.
  sections:
  - title: Store enough context to continue
    paragraphs:
    - A saved answer can lose the question that made it useful. A command can lose
      the environment where it worked. A decision can survive after the condition
      behind it changes.
    - I try to preserve those relationships. A useful record says what I observed,
      where the information came from, and what someone needs to check before using
      it again.
    - That does not require keeping every conversation. It requires making deliberate
      choices about the information that helps the next session.
    - Corrections matter as much as conclusions. If a later finding changes the answer,
      I want the next person or agent to see that change.
    bullets: []
  - title: Build the persistence layer
    paragraphs:
    - postgres-mcp-tools provides PostgreSQL persistence, memory-management operations,
      vector-query paths, and MCP or HTTP transport code.
    - The work includes packaging, build behavior, and transport handling. It also
      keeps log output from interfering with protocol messages.
    - The package builds on the MCP SDK and PostgreSQL ecosystem. My contribution
      is the application and integration work around them.
    - Some paths and provider assumptions still need further validation. I keep that
      distinction visible because persistent storage alone does not make every saved
      answer correct.
    bullets: []
  - title: Explore how a finding becomes reusable knowledge
    paragraphs:
    - Crisi is my independent prototype for connecting memory with process checks.
      It asks how information moves from a source into a useful finding, and how a
      process can reveal missing information.
    - The implementation includes source provenance, scoped access, process-gap evaluation,
      and decisions about which records become reusable memory.
    - I use synthetic examples to explore that behavior. The current reference system
      does not represent a launched service or a live connection to every planned
      provider.
    - 'This makes room to examine a difficult question early: what should the system
      do when a required source is missing? I want it to show the missing information
      and preserve the question.'
    bullets: []
  - title: Give the next agent a usable handoff
    paragraphs:
    - Sullydox addresses the same problem through documents. It contains reusable
      role instructions, work records, review steps, and handoff formats.
    - A finding keeps the same identifier as it moves through a review. The handoff
      records what changed and which questions remain open. A relevant code change
      can require an earlier review to be repeated.
    - The method also limits repeated repair rounds. A task needs a clear point where
      an unresolved issue returns to a person for a decision.
    - These documents are a working method. They are not a separate runtime or a claim
      that agents can manage a project without human direction.
    bullets: []
  - title: Use memory as a starting point
    paragraphs:
    - My goal is to spend less time reconstructing context and more time making the
      next useful decision.
    - That goal changes how I direct agents. I ask them to preserve assumptions, record
      failed approaches, and distinguish an observed result from an expected one.
    - A remembered configuration can become stale. A previous test can stop applying
      after a change. I use saved knowledge to guide the next check, then return to
      the relevant system or source.
    - 'The result I want is practical: another session can continue the work with
      a clear account of where it stands.'
    bullets: []
  projects:
  - name: postgres-mcp-tools
    description: PostgreSQL-backed memory operations, vector-query paths, and MCP
      or HTTP transport support.
    state: Published npm utility
    href: https://www.npmjs.com/package/postgres-mcp-tools
