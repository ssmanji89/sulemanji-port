name: Build and deploy Sulemanji.com

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Validate only, or deploy to Cloudflare staging or production
        required: true
        type: choice
        options: [validate, staging, production]
        default: validate

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.pull_request.number) || 'site-production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOY_TARGET: ${{ vars.SITE_DEPLOY_TARGET || 'pages' }}
      SITE_VERSION_ASSETS: ${{ github.repository == 'ssmanji89/sulemanji-port' && vars.SITE_DEPLOY_TARGET == 'cloudflare' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            cloudflare/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete release gates and build once
        env:
          SITE_RETAIN_LIVE_ASSETS: ${{ github.repository == 'ssmanji89/sulemanji-port' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_environment == 'production') && '1' || '0' }}
        run: bash scripts/check_site_release.sh

      - name: Upload Pages artifact
        if: github.repository == 'ssmanji89/sulemanji-port' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SITE_DEPLOY_TARGET != 'cloudflare'
        uses: actions/upload-pages-artifact@v3

      - name: Upload immutable Cloudflare artifact
        if: (github.repository == 'ssmanji89/sulemanji-port' && vars.SITE_DEPLOY_TARGET == 'cloudflare' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging'))) || (github.repository == 'ssmanji89/sulemanji-editorial-fixture' && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    needs: build
    if: github.repository == 'ssmanji89/sulemanji-port' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production')) && vars.SITE_DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare-staging:
    needs: build
    if: github.repository == 'ssmanji89/sulemanji-port' && github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging' && vars.SITE_DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-staging
    concurrency:
      group: cloudflare-site-staging
      cancel-in-progress: false
    env:
      SITE_DEPLOY_TARGET: cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      SITE_TARGET_HOST: ${{ vars.CLOUDFLARE_STAGING_HOST }}
    steps:
      - name: Checkout exact artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudflare CLI
        run: npm ci --prefix cloudflare
      - name: Download immutable site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
      - name: Deploy staging and read back public routes
        run: bash scripts/deploy_site.sh --environment staging --source-commit "${{ github.sha }}" --artifact _site
      - name: Preserve private deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-staging-${{ github.sha }}
          path: ${{ runner.temp }}/sulemanji-staging-${{ github.sha }}.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-editorial-fixture:
    needs: build
    if: github.repository == 'ssmanji89/sulemanji-editorial-fixture' && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cloudflare-editorial-fixture
    env:
      SITE_DEPLOY_TARGET: cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FIXTURE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudflare CLI
        run: npm ci --prefix cloudflare
      - name: Download immutable site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
      - name: Deploy privately for editorial readback
        run: bash scripts/deploy_site.sh --environment editorial-fixture --source-commit "${{ github.sha }}" --artifact _site
      - name: Record verified site manifest
        run: |
          digest=$(sha256sum _site/release.json)
          printf '::notice file=.github/workflows/jekyll.yml,title=Verified site manifest::site-release-manifest-sha256-v1 %s %s\n' "$GITHUB_SHA" "${digest%% *}"
      - name: Preserve private deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-editorial-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/sulemanji-editorial-fixture-${{ github.sha }}.json
          if-no-files-found: ignore
          retention-days: 14

  deploy-cloudflare:
    needs: build
    if: github.repository == 'ssmanji89/sulemanji-port' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY_TARGET == 'cloudflare' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production'))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
    concurrency:
      group: cloudflare-site-production
      cancel-in-progress: false
    env:
      SITE_DEPLOY_TARGET: cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudflare CLI
        run: npm ci --prefix cloudflare
      - name: Download immutable site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
      - name: Deploy production and verify canonical host
        run: bash scripts/deploy_site.sh --environment production --source-commit "${{ github.sha }}" --artifact _site
      - name: Record verified site manifest
        run: |
          digest=$(sha256sum _site/release.json)
          printf '::notice file=.github/workflows/jekyll.yml,title=Verified site manifest::site-release-manifest-sha256-v1 %s %s\n' "$GITHUB_SHA" "${digest%% *}"
      - name: Preserve private deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-production-${{ github.sha }}
          path: ${{ runner.temp }}/sulemanji-production-${{ github.sha }}.json
          if-no-files-found: ignore
          retention-days: 30
